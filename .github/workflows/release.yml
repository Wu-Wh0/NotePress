name: Release install package

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: native-wordpress-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Verify tag matches the declared plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const expected = `v${pkg.version}`;
            if (tag !== expected || manifest.version !== pkg.version) {
              console.error(`tag_mismatch ${tag} ${expected} manifest=${manifest.version}`);
              process.exit(1);
            }
            process.stdout.write(`releasing ${tag}\n`);
          '

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test

      - name: Build deterministic install ZIP
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run build

      - name: Confirm the archive holds only the three installation files
        run: |
          test -f dist/wordpress-publisher.zip
          entries="$(unzip -Z1 dist/wordpress-publisher.zip | sort | tr '\n' ' ')"
          echo "archive entries: ${entries}"
          test "${entries}" = "main.js manifest.json styles.css "

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$(mktemp)"
          printf '%s\n' \
            "Desktop Obsidian plugin publishing through WordPress native HTTPS REST." \
            "" \
            "Install \`main.js\`, \`manifest.json\` and \`styles.css\` in" \
            "\`<vault>/.obsidian/plugins/wordpress-publisher/\`, or extract \`wordpress-publisher.zip\` there." \
            "" \
            "Requires Obsidian desktop 1.11.4 or later and a WordPress application password." \
            "" \
            "See README.md for the supported boundary and the documented limits." > "${notes}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/wordpress-publisher.zip --clobber
          else
            gh release create "${RELEASE_TAG}" dist/wordpress-publisher.zip --title "Obsidian WordPress publisher ${RELEASE_TAG}" --notes-file "${notes}"
          fi
          rm -f "${notes}"