name: Publication fast checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full-wordpress:
        description: Run pinned producer, PHP-WASM, WordPress and session integration regressions
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publication-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Boundary, plugin and mandatory PHP lint
        working-directory: implementation/publication-v1
        run: |
          command -v php
          python -B -m unittest discover -s tests -p test_server_boundary.py -v
          node --test tests/test_plugin_selection.js tests/test_plugin_entry.js
          for file in server/*.php; do php -l "$file"; done
  full-wordpress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['full-wordpress'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Full synthetic producer and WordPress regression
        run: bash implementation/publication-v1/ci/ci-full-wordpress.sh
