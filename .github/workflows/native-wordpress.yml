name: Native WordPress plugin build
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'manifest.json'
      - 'versions.json'
      - 'styles.css'
      - '.gitattributes'
      - '.github/workflows/native-wordpress.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'manifest.json'
      - 'versions.json'
      - 'styles.css'
      - 'README.md'
      - '.gitattributes'
      - '.github/workflows/native-wordpress.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-wordpress-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Bounded OpenSSL portability probe
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node -e '
            const { spawnSync } = require("node:child_process");
            const result = spawnSync("openssl", ["version", "-d"], {
              encoding: "utf8",
              timeout: 10000,
              windowsHide: true,
              env: process.env,
            });
            if (result.error || result.signal || result.status !== 0) {
              console.error("openssl probe failed", result.error?.message || result.signal || result.status);
              process.exit(1);
            }
            process.stdout.write(result.stdout.trim() + "\n");
          '
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test
      - name: Build desktop plugin and install ZIP
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run build
